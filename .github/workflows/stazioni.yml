# Meteo Radar · le stazioni vicine (v65 · ponte 2)
#
# Ogni avvio è un giro lungo: interroga Netatmo e gli aeroporti tre volte
# (subito, dopo 18 minuti, dopo 36) e pubblica le letture sul ramo "dati",
# che contiene SEMPRE un solo commit: niente cronologia che cresce, e il
# ramo principale (questo file, il programma) non viene mai toccato.
#
# I segreti (NETATMO_CLIENT_ID, NETATMO_CLIENT_SECRET, NETATMO_REFRESH_TOKEN)
# stanno nelle impostazioni del repository: nell'app non entra niente.
# Il gettone rinnovato vive cifrato in stato/netatmo.enc sul ramo "dati".
#
# PERCHÉ SI RILANCIA DA SOLO. GitHub non garantisce gli avvii programmati:
# il 3 settembre ha saltato quelli delle 12:09 e delle 13:09, e l'app è
# rimasta senza letture fresche. Perciò alla fine di ogni giro lungo il
# workflow chiede a GitHub di farne partire un altro (workflow_dispatch):
# la catena non dipende dall'orologio di GitHub. L'orario programmato resta
# come rete di sicurezza: se la catena si spezza, la riannoda. Non si
# raddoppia mai: prima di rilanciarsi si controlla che non ci sia già un
# altro giro in coda o in corso.
name: Stazioni vicine

on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: stazioni-vicine
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Prendi il programma
        uses: actions/checkout@v5

      - name: Prepara Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Recupera lo stato dal ramo dati
        run: |
          mkdir -p stato
          if git fetch --depth 1 origin dati 2>/dev/null; then
            git show FETCH_HEAD:stato/netatmo.enc > stato/netatmo.enc 2>/dev/null || true
            git show FETCH_HEAD:mattonelle.json > mattonelle.json 2>/dev/null || true
            git show FETCH_HEAD:aeroporti.json > aeroporti.json 2>/dev/null || true
            [ -s stato/netatmo.enc ] || rm -f stato/netatmo.enc
            [ -s mattonelle.json ] || rm -f mattonelle.json
            [ -s aeroporti.json ] || rm -f aeroporti.json
            # le celle già pubblicate: servono a riportare le letture del giro
            # prima dove Netatmo oggi non risponde
            git checkout FETCH_HEAD -- celle 2>/dev/null || true
            git reset -q -- celle 2>/dev/null || true
            echo "stato recuperato ($(ls celle 2>/dev/null | wc -l) celle del giro prima)"
          else
            echo "primo giro: nessuno stato"
          fi

      - name: Tre giri di letture
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: |
          for giro in 1 2 3; do
            echo "── giro $giro ──"
            if node ponte_stazioni.mjs; then
              rm -rf /tmp/pub && mkdir -p /tmp/pub
              cp -r celle /tmp/pub/ 2>/dev/null || true
              cp aeroporti.json indice.json mattonelle.json /tmp/pub/ 2>/dev/null || true
              mkdir -p /tmp/pub/stato && cp stato/netatmo.enc /tmp/pub/stato/ 2>/dev/null || true
              cd /tmp/pub
              git init -q -b dati
              git config user.name "Meteo Radar"
              git config user.email "stazioni@meteoradar.local"
              git add -A
              git commit -q -m "Letture del $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
              git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dati
              cd "$GITHUB_WORKSPACE"
              echo "pubblicato"
            else
              echo "giro $giro fallito: si riprova al prossimo"
            fi
            if [ "$giro" -lt 3 ]; then sleep 1080; fi
          done

      - name: Rilancia il prossimo giro lungo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          altri=0
          for stato in queued waiting pending requested in_progress; do
            n=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --status "$stato" \
                  --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length" 2>/dev/null || echo 0)
            altri=$((altri + n))
          done
          if [ "$altri" -gt 0 ]; then
            echo "c'è già un altro giro in coda o in corso ($altri): non mi rilancio"
          else
            gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
            echo "prossimo giro chiesto a GitHub"
          fi

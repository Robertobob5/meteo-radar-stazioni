# Meteo Radar · le stazioni vicine (v65 · ponte 2.2)
#
# Ogni avvio è un giro lungo: interroga Netatmo e gli aeroporti tre volte
# (subito, dopo 18 minuti, dopo 36) e pubblica le letture sul ramo "dati",
# che contiene SEMPRE un solo commit: niente cronologia che cresce, e il
# ramo principale (questo file, il programma) non viene mai toccato.
#
# I segreti (NETATMO_CLIENT_ID, NETATMO_CLIENT_SECRET, NETATMO_REFRESH_TOKEN)
# stanno nelle impostazioni del repository: nell'app non entra niente.
# Il gettone rinnovato vive cifrato in stato/netatmo.enc sul ramo "dati".
#
# PONTE 3 (8 settembre 2026): oltre alle letture, ogni giro aggiorna la
# REPUTAZIONE di ogni stazione (quanto legge rispetto alle vicine, di notte e
# col sole, e quanto la sua zona sta sopra l'aeroporto). Sono somme che si
# accumulano, quindi vanno riprese dal ramo "dati" a ogni avvio e ripubblicate
# insieme al resto: la cartella "reputazione". L'app di oggi non la guarda.
#
# PERCHÉ SI RILANCIA DA SOLO, E SUBITO. GitHub non garantisce gli avvii
# programmati (il 3 settembre ne ha saltati sette su otto), e ogni tanto
# spegne un runner a metà lavoro ("The operation was canceled", run #8,
# senza che nessun nostro comando fosse fallito). Perciò ogni giro lungo
# PRENOTA il successivo appena parte: il successivo resta in coda (la
# concurrency ne fa aspettare uno solo) e parte quando questo finisce —
# oppure entro un minuto, se questo viene ucciso. Prima di prenotare si
# controlla che non ci sia già un giro in coda, così non si raddoppia mai.
# L'orario programmato resta come rete di sicurezza in più.
#
# PONTE 3.3 (8 ottobre 2026): I METAR SI RINFRESCANO OGNI 6 MINUTI. Il giro
# lungo legge gli aeroporti una volta ogni ~23 minuti (Netatmo non si può
# chiedere più spesso), ma il bollettino nasce ogni 30 minuti e poteva
# arrivare all'app anche 35 minuti dopo: l'8 ottobre alle 12:39, con la
# pioggia addosso, l'app aveva in mano un bollettino "scaduto" e quello
# nuovo non era ancora arrivato. Ora, nella pausa di 18 minuti fra un giro
# e l'altro, ogni 6 minuti ponte_aeroporti.mjs chiede SOLO i METAR (una
# chiamata, nessun segreto) e si pubblica soltanto se c'è un'osservazione
# nuova. Netatmo, le celle e la reputazione: come prima.
#
# PONTE 3.4 (15 ottobre 2026): NIENTE PIÙ ERRORI IN SILENZIO.
# · Un giro fallito pubblicava gli aeroporti SENZA indice.json (si
#   riprendevano dal ramo dati solo i file di un elenco, e lui non c'era):
#   il 15 ottobre dalle 07:29 alle 07:56 il ramo è rimasto senza, e la
#   carta dell'app è sparita. Ora il ramo dati si prende INTERO in una
#   cartella a parte, i programmi lavorano lì e si ripubblica la cartella
#   intera: quello che un giro non rifà resta com'era. Se il ramo c'è ma non
#   si legge, niente giri (un ramo vuoto cancellerebbe la reputazione).
# · Il gettone d'accesso Netatmo (3 ore) si tiene cifrato in
#   stato/accesso.enc e si riusa: il rinnovo si chiede di rado. Un gettone
#   di rinnovo nuovo si pubblica SUBITO (pubblica.sh), prima di raccogliere:
#   il 14 ottobre il giro #1437 l'ha perso, troncato dal tempo massimo.
# · Il tempo massimo passa da 58 a 70 minuti: tre giri lenti con le due
#   pause arrivano a 59 minuti e il terzo veniva troncato prima di pubblicare.
# · Alla fine di ogni giro lungo, ponte_allarme.mjs scrive nel riassunto
#   quando sono state aggiornate stazioni e aeroporti e, se le stazioni sono
#   ferme da più di 2 ore, apre UNA issue «Ponte stazioni fermo» (e la chiude
#   da sola quando tornano fresche). Il lavoro resta verde: niente mail ogni ora.
#
# PONTE 3.5 (15 ottobre 2026): ORARI FISSI E PROVA DELL'ALLARME. Netatmo
# concede 500 richieste l'ora, e le raccolte (23 minuti l'una dall'altra in un
# lavoro, 5 minuti a cavallo fra due lavori) arrivavano a 631. Ora le raccolte
# cadono a orari fissi, tre l'ora (:05, :25, :45), e ogni lavoro fa quelle che
# gli stanno nel tempo (di solito due): circa 370 richieste l'ora. Un tetto
# sull'ora mobile a 480 resta come rete di sicurezza (stato/chiamate.json); se
# scatta, il taglio gira per tutta Italia invece di cadere sempre sul Nord.
# Lanciando il lavoro
# a mano con «prova_allarme» acceso, il bot apre la issue «Prova allarme
# ponte» e la chiude dopo 2 minuti, senza toccare le stazioni né il ramo dati:
# quel giro ha un nome e una coda sua, così non scalza il giro vero in attesa.
# I giri che si prenotano da soli non accendono mai la prova.
name: Stazioni vicine
run-name: ${{ inputs.prova_allarme && 'Prova allarme ponte' || 'Stazioni vicine' }}

on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      prova_allarme:
        description: "Solo la prova dell'allarme: il bot apre la issue «Prova allarme ponte» e la chiude dopo 2 minuti (stazioni e ramo dati non si toccano)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write     # ponte 3.4: l'allarme apre e chiude la issue «Ponte stazioni fermo»

concurrency:
  # la prova dell'allarme ha una coda sua: non deve né aspettare né scalzare il giro vero
  group: ${{ inputs.prova_allarme && 'prova-allarme' || 'stazioni-vicine' }}
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Prendi il programma
        uses: actions/checkout@v5

      - name: Prenota il prossimo giro lungo
        if: ${{ !inputs.prova_allarme }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          altri=0
          for stato in queued waiting pending requested; do
            n=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --status "$stato" \
                  --json databaseId,displayTitle --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .displayTitle != \"Prova allarme ponte\")] | length" 2>/dev/null || echo 0)
            altri=$((altri + n))
          done
          if [ "$altri" -gt 0 ]; then
            echo "c'è già un giro in coda ($altri): non prenoto"
          else
            for tentativo in 1 2 3; do
              if gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"; then
                echo "prossimo giro prenotato (parte quando questo finisce, o subito se questo muore)"
                break
              fi
              echo "prenotazione non riuscita (tentativo $tentativo): riprovo fra 20 s"
              sleep 20
            done
          fi

      - name: Prepara Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Recupera lo stato dal ramo dati
        if: ${{ !inputs.prova_allarme }}
        env:
          PONTE_DATI: ${{ runner.temp }}/dati
        run: |
          # ponte 3.4: il ramo dati si prende INTERO in una cartella a parte, i programmi
          # lavorano lì dentro e pubblica.sh ripubblica la cartella intera. Quello che un
          # giro non rifà (indice.json quando il giro fallisce, la reputazione, lo stato,
          # un file che domani ancora non c'è) resta com'era: niente più elenchi da ricordare.
          rm -rf "$PONTE_DATI" && mkdir -p "$PONTE_DATI"
          preso=no
          for tentativo in 1 2 3; do
            if git fetch -q --depth 1 origin dati 2>/dev/null; then preso=si; break; fi
            echo "il ramo dati non risponde (tentativo $tentativo): riprovo fra 10 s"
            sleep 10
          done
          if [ "$preso" = si ]; then
            git archive FETCH_HEAD | tar -x -C "$PONTE_DATI"
            echo "stato recuperato ($(ls "$PONTE_DATI/celle" 2>/dev/null | wc -l) celle e $(ls "$PONTE_DATI/reputazione" 2>/dev/null | wc -l) celle di reputazione del giro prima)"
          else
            codice=0
            git ls-remote --exit-code origin refs/heads/dati > /dev/null 2>&1 || codice=$?
            if [ "$codice" -eq 2 ]; then
              echo "primo giro: nessuno stato"
            else
              # un ramo vuoto pubblicato sopra quello vero cancellerebbe la reputazione di settimane
              echo "::error::il ramo dati c'è ma adesso non si legge: niente giri, si riprova al prossimo"
              exit 1
            fi
          fi

      - name: Giri di letture agli orari fissi
        if: ${{ !inputs.prova_allarme }}
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PONTE_DATI: ${{ runner.temp }}/dati
          # ponte 3.4: il programma chiama pubblica.sh appena salva un gettone di rinnovo
          # nuovo (prima di raccogliere) e annota gli errori, senza segreti, per l'allarme
          PONTE_PUBBLICA: ${{ github.workspace }}/pubblica.sh
          PONTE_ERRORE: ${{ runner.temp }}/errori.txt
        run: |
          # ponte 3.5: le raccolte cadono a orari fissi, tre l'ora (ai minuti :05, :25 e :45).
          # Ogni giro aspetta il suo prossimo orario libero (lo dice ponte_stazioni.mjs, che
          # ricorda in stato/orario.json l'ultimo fatto); nell'attesa, ogni 6 minuti, si
          # rinfrescano SOLO i METAR (ponte 3.3). Un giro parte solo se il suo orario cade
          # entro 50 minuti dall'inizio di questo passo: il più lento visto dura 9 minuti, e
          # il lavoro ne ha 70. Gli orari dopo li fa il lavoro dopo, già prenotato.
          cd "$PONTE_DATI"
          inizio=$(date +%s)
          limite=$(( inizio + 50 * 60 ))
          aspetta_fino() {
            while :; do
              resta=$(( $1 - $(date +%s) ))
              [ "$resta" -le 0 ] && return 0
              if [ "$resta" -gt 390 ]; then
                sleep 360
                echo "── rinfresco aeroporti $(TZ=Europe/Rome date -d @"$(date +%s)" +%H:%M) ──"
                if timeout 90 node "$GITHUB_WORKSPACE/ponte_aeroporti.mjs"; then
                  bash "$PONTE_PUBBLICA"
                fi
              else
                sleep "$resta"
              fi
            done
          }
          tentato=""
          while :; do
            orario=$(node "$GITHUB_WORKSPACE/ponte_stazioni.mjs" --prossimo-orario) || orario=""
            if [ -z "$orario" ]; then
              echo "⚠ non so quando cade il prossimo orario: ci pensa il lavoro dopo"
              break
            fi
            ora=$(TZ=Europe/Rome date -d @"$orario" +%H:%M)
            if [ "$orario" -gt "$limite" ]; then
              echo "il prossimo orario ($ora) tocca al lavoro dopo"
              break
            fi
            if [ "$orario" = "$tentato" ]; then
              # il giro si è rotto prima di segnare il suo orario: non lo si ritenta, si passa al dopo
              echo "l'orario delle $ora è già stato tentato: passo al successivo"
              aspetta_fino $(( orario + 5 * 60 + 1 ))
              continue
            fi
            tentato="$orario"
            aspetta_fino "$orario"
            echo "── giro delle $ora ──"
            esito=0
            PONTE_ORARIO="$orario" node "$GITHUB_WORKSPACE/ponte_stazioni.mjs" || esito=$?
            if [ "$esito" -eq 0 ]; then
              bash "$PONTE_PUBBLICA"
            elif [ "$esito" -eq 4 ]; then
              echo "orario delle $ora saltato: si passa al successivo"
            else
              echo "giro delle $ora fallito: si riprova al prossimo orario"
            fi
          done

      - name: Riassunto e allarme
        if: ${{ always() && !inputs.prova_allarme }}
        env:
          GH_TOKEN: ${{ github.token }}
          PONTE_ERRORE: ${{ runner.temp }}/errori.txt
        run: |
          # si guarda il ramo dati così com'è pubblicato: è quello che vede l'app
          ultimi="$RUNNER_TEMP/ultimi"
          rm -rf "$ultimi" && mkdir -p "$ultimi"
          if git fetch -q --depth 1 origin dati 2>/dev/null && git archive FETCH_HEAD | tar -x -C "$ultimi"; then
            node ponte_allarme.mjs "$ultimi" || true
          else
            # niente falsi allarmi per un attimo di rete: si guarda al giro dopo
            echo "⚠ il ramo dati non si legge adesso: riassunto e allarme al prossimo giro" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prova dell'allarme
        if: ${{ inputs.prova_allarme }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # la stessa strada dell'allarme vero: issue aperta dal bot, con la menzione
          node ponte_allarme.mjs --prova apri
          sleep 120
          node ponte_allarme.mjs --prova chiudi

      - name: Controllo finale della prenotazione
        if: ${{ always() && !inputs.prova_allarme }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          altri=0
          for stato in queued waiting pending requested; do
            n=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --status "$stato" \
                  --json databaseId,displayTitle --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .displayTitle != \"Prova allarme ponte\")] | length" 2>/dev/null || echo 0)
            altri=$((altri + n))
          done
          if [ "$altri" -gt 0 ]; then
            echo "il prossimo giro è in coda ($altri): tutto a posto"
          else
            echo "nessun giro in coda (la prenotazione è stata annullata?): lo prenoto adesso"
            gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" && echo "prenotato" || echo "prenotazione non riuscita: ci penserà l'orario programmato"
          fi
